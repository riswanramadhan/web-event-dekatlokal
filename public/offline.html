<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0255F5" />
    <title>Offline | DekatEvent</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fbff;
        color: #111827;
      }

      main {
        width: min(100%, 480px);
        border: 1px solid #dbe5f7;
        border-radius: 24px;
        background: #ffffff;
        padding: 32px;
        text-align: center;
      }

      img {
        width: 64px;
        height: 64px;
      }

      h1 {
        margin: 24px 0 0;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 14px auto 0;
        max-width: 36ch;
        color: #5d6678;
        line-height: 1.7;
      }

      button {
        min-height: 48px;
        margin-top: 24px;
        border: 0;
        border-radius: 999px;
        padding: 0 24px;
        background: #0255f5;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid rgba(2, 85, 245, 0.45);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/dekatlokal-mark.png" alt="" width="64" height="64" />
      <h1>Koneksi lagi putus</h1>
      <p>
        DekatEvent belum bisa memuat halaman ini. Sambungkan internet, lalu
        coba lagi.
      </p>
      <button type="button" onclick="window.location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
